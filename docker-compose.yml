# Entorno local de Datecito: API Laravel + MySQL + Redis + SeaweedFS (S3, equivalente local de Cloudflare R2) + Mailpit.
# Uso (desde la carpeta backend/):  docker compose up -d
# Las contraseñas se leen de backend/.env (nunca se suben a Git).
name: datecito

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: datecito-app
  volumes:
    - ./:/var/www/html
    # vendor vive dentro de Docker: leerlo desde el disco de Windows es muy lento.
    - vendor:/var/www/html/vendor
  restart: unless-stopped

services:
  app:
    <<: *php
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --timeout=60
    depends_on:
      - app

  scheduler:
    <<: *php
    command: php artisan schedule:work
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # Sólo accesible desde tu PC (127.0.0.1), nunca desde la red.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped

  # Almacenamiento de objetos compatible con S3. El bucket se crea con: php artisan datecito:storage-setup
  storage:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "/seaweed-start.sh"]
    environment:
      S3_KEY: ${AWS_ACCESS_KEY_ID}
      S3_SECRET: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:8333"
    volumes:
      - storage-data:/data
      - ./docker/storage/start.sh:/seaweed-start.sh:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  vendor:
  mysql-data:
  storage-data:
