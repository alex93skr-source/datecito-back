server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 14m;
    server_tokens off;


    # Nunca servir archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        # Resuelve "app" en cada petición (DNS de Docker): si el contenedor se reinicia
        # y cambia de IP, nginx no se queda apuntando a la anterior (error 502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Cualquier otro .php no se ejecuta
    location ~ \.php$ {
        return 404;
    }
}
