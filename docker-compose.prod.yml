# Producción de Datecito en el VPS (Hostinger). Se despliega con scripts/deploy.sh desde la PC.
#
# Sólo Caddy expone puertos (80/443) y reparte por subdominio con HTTPS automático (Let's Encrypt):
#   DOMAIN y www.DOMAIN  → sitio web (web/dist)
#   api.DOMAIN           → API Laravel (nginx + php-fpm)
#   crm.DOMAIN           → CRM interno (crm/dist)
#   fotos.DOMAIN         → almacenamiento de fotos (enlaces firmados; se cambia por R2 cuando toque)
# Las contraseñas se leen de /srv/datecito/backend/.env (nunca se suben a Git).
name: datecito

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: datecito-app
  volumes:
    - ./:/var/www/html
    - vendor:/var/www/html/vendor
  restart: always
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  app:
    <<: *php
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --timeout=60 --sleep=2 --max-time=3600
    depends_on: [app]

  scheduler:
    <<: *php
    command: php artisan schedule:work
    depends_on: [app]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: always
    logging: *logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/datecito/web:/srv/web:ro
      - /srv/datecito/crm:/srv/crm:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [nginx, storage]
    restart: always
    logging: *logging

  mysql:
    image: mysql:8.4
    command: --innodb-buffer-pool-size=1G --max-connections=150
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: always
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: always
    logging: *logging

  # Fotos (S3 compatible). Privado: sólo se llega a él por enlaces firmados vía fotos.DOMAIN.
  storage:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "/seaweed-start.sh"]
    environment:
      S3_KEY: ${AWS_ACCESS_KEY_ID}
      S3_SECRET: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - storage-data:/data
      - ./docker/storage/start.sh:/seaweed-start.sh:ro
    restart: always
    logging: *logging

volumes:
  vendor:
  mysql-data:
  redis-data:
  storage-data:
  caddy-data:
  caddy-config:
